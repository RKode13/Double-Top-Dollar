<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Double Dollar Deal</title>
<meta name="description" content="An original 3-reel, 5-line classic slot with a take-it-or-try-again Deal Round. Play money only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
/* Anton (SIL Open Font License). The Android build bundles anton.woff2; on the web it comes from Google Fonts. */
@font-face{font-family:AntonLocal;src:url(anton.woff2) format("woff2");font-display:swap}
:root{
  --bg:#07060b; --gold:#ffd23f; --gold2:#c98a00; --green:#19c95b; --red:#ff2b3a;
  --led:#ff3b2f; --white:#fffaf0; --h:68px; --off:calc(var(--h)*.2); --chip:min(58px,15.5vw);
  --panel:#14101c; --panel2:#1d1828;
  --chrome:linear-gradient(180deg,#fafafe 0%,#b9b9c8 18%,#f2f2f8 38%,#7d7d8e 60%,#d9d9e4 80%,#8d8d9c 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--white);font-family:AntonLocal,Anton,"Arial Black",Impact,system-ui,sans-serif;display:flex;justify-content:center;
  overflow-x:hidden;user-select:none;-webkit-user-select:none;
  background:repeating-conic-gradient(from 0deg at 50% 0%,#ffffff05 0 6deg,transparent 6deg 12deg),radial-gradient(ellipse at top,#2a1145 0%,#0b0712 55%,var(--bg) 100%);
  background-color:var(--bg)}

/* ---------- Cabinet ---------- */
.cab{position:relative;width:min(460px,100vw);margin:6px 0 16px;padding:16px 16px 14px;border-radius:30px;
  background:linear-gradient(180deg,#3a1556 0%,#1d0a2c 40%,#140720 100%);
  box-shadow:0 0 0 3px #f1f1f7,0 0 0 6px #6c6c7c,0 0 0 8px #c9c9d6,0 0 0 10px #3a3a46,0 18px 40px #000,inset 0 0 40px #000a}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:3}
.bulb{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#8a7230,#3d2f08);transition:background .06s,box-shadow .06s}
.bulb.on{background:radial-gradient(circle at 35% 35%,#fff,#ffe58a 50%,#ffb300);box-shadow:0 0 6px 2px #ffd23f,0 0 14px 4px #ffb30088}
.bulb.on.g{background:radial-gradient(circle at 35% 35%,#fff,#9dffbf 50%,#19c95b);box-shadow:0 0 6px 2px #19c95b,0 0 14px 4px #19c95b88}
.bulb.on.r{background:radial-gradient(circle at 35% 35%,#fff,#ff9aa2 50%,#ff2b3a);box-shadow:0 0 6px 2px #ff2b3a,0 0 14px 4px #ff2b3a88}

/* ---------- Marquee ---------- */
.marquee{position:relative;border-radius:60px 60px 10px 10px/40px 40px 10px 10px;padding:10px 10px 8px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#5b2390 0%,#2a0d40 70%);box-shadow:0 0 0 3px var(--gold2),0 0 0 5px #5a3a00,inset 0 -10px 20px #0008}
.marquee::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 120%,#ffffff10 0 4deg,transparent 4deg 10deg)}
.title{position:relative;text-align:center;line-height:.9}
.title .l1{font-size:clamp(26px,8.4vw,40px);letter-spacing:1px;
  background:linear-gradient(180deg,#fffbe0 0%,#ffe27a 30%,#d99b00 55%,#fff0a8 70%,#b37a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px #5a3a00;filter:drop-shadow(0 3px 0 #3d2600) drop-shadow(0 0 10px #ffb30088)}
.title .l2{font-size:clamp(20px,6.4vw,28px);color:#b9ffd0;letter-spacing:10px;margin-top:2px;
  text-shadow:0 0 4px #fff,0 0 10px #19c95b,0 0 22px #19c95b,0 0 34px #19c95b}
.title .l2 .st{color:var(--gold);letter-spacing:0;text-shadow:0 0 8px #ffb300}

/* ---------- Offer board (casino chips on felt) ---------- */
.board{position:relative;margin-top:10px;padding:8px 8px 10px;border-radius:14px;
  background:radial-gradient(ellipse at 50% 30%,#1f7a45 0%,#0f4a28 55%,#08301a 100%);
  box-shadow:0 0 0 3px #c98a00,0 0 0 5px #5a3a00,inset 0 0 24px #000c}
.board::before{content:"";position:absolute;inset:0;border-radius:14px;opacity:.25;pointer-events:none;
  background:repeating-linear-gradient(45deg,#0000 0 2px,#0003 2px 3px)}
.toprow{position:relative;display:grid;grid-template-columns:1fr 2.3fr 1fr;gap:6px;align-items:center}
.grid9{position:relative;display:grid;grid-template-columns:repeat(3,1fr);row-gap:6px;margin-top:6px;justify-items:center}
.chip{position:relative;width:var(--chip);height:var(--chip);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,var(--c) 0 56%,#0000 57%),repeating-conic-gradient(var(--c) 0 20deg,#fff 20deg 30deg,var(--c) 30deg 45deg);
  box-shadow:inset 0 0 0 2px #0004,0 3px 0 var(--d),0 6px 0 #0006,0 8px 10px #000a;transition:filter .15s,transform .15s,box-shadow .15s}
.chip::before{content:"";position:absolute;inset:19%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#ece6d8 70%,#cfc6b2);box-shadow:0 0 0 2px var(--d),inset 0 -2px 3px #0003}
.chip .v{position:relative;font-family:AntonLocal,Anton,"Arial Black",sans-serif;font-size:calc(var(--chip)*.25);color:var(--d);letter-spacing:0;line-height:1}
.plaque{position:relative;justify-self:stretch;border-radius:10px;padding:5px 4px 6px;text-align:center;
  background:linear-gradient(180deg,#fff3b0,#e0a400 45%,#ffd23f 55%,#8a5a00);box-shadow:0 3px 0 #5a3a00,0 6px 10px #000a,inset 0 0 0 2px #fff6;transition:filter .15s,transform .15s}
.plaque .lb{font:400 11px AntonLocal,Anton,"Arial Black",sans-serif;letter-spacing:3px;color:#4b2a00}
.plaque .v{margin:2px auto 0;width:92%;border-radius:6px;background:#160303;box-shadow:inset 0 2px 6px #000;
  font-family:"Courier New",monospace;font-weight:900;font-size:clamp(22px,7.4vw,32px);color:#ff4636;text-shadow:0 0 8px #ff3b2f}
.star{justify-self:center;width:clamp(54px,16vw,68px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0%,61% 18%,82% 10%,80% 32%,100% 40%,86% 56%,98% 76%,76% 78%,68% 100%,50% 88%,32% 100%,24% 78%,2% 76%,14% 56%,0% 40%,20% 32%,18% 10%,39% 18%);
  background:radial-gradient(circle at 40% 35%,#fffbe0,#ffd23f 40%,#c98a00 75%,#7a4a00);transition:filter .15s,transform .3s}
.star b{font-size:clamp(17px,5.2vw,22px);color:#4b0f73;text-shadow:0 1px 0 #fff8}
.board.bonus .chip,.board.bonus .plaque,.board.bonus .star{filter:brightness(.32) saturate(.5)}
.board.bonus .lit{filter:none!important}
.chip.lit{transform:translateY(-5px) scale(1.06);box-shadow:inset 0 0 0 2px #0004,0 3px 0 var(--d),0 6px 0 #0006,0 0 0 3px #fff,0 0 18px 6px var(--c)}
.plaque.lit{transform:scale(1.04);box-shadow:0 3px 0 #5a3a00,0 0 22px 6px #ffd23f}
.star.lit{transform:rotate(18deg) scale(1.08);filter:drop-shadow(0 0 10px #ffd23f)!important}
.chip.won,.plaque.won{animation:won .3s steps(2) infinite}
@keyframes won{50%{filter:brightness(1.5)!important}}
.star.flick{animation:flick .12s steps(2) infinite}
@keyframes flick{50%{filter:none}}

/* ---------- Message bar (dot-matrix) ---------- */
.msgbar{position:relative;margin-top:10px;height:50px;border-radius:9px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;
  box-shadow:0 0 0 3px #3a3a46,0 0 0 5px #9a9aa8,inset 0 0 12px #000;background-image:radial-gradient(#10301f 1px,transparent 1.5px);background-size:4px 4px}
.msgbar .t{font-size:clamp(14px,4.6vw,20px);letter-spacing:1px;color:#5dffae;text-shadow:0 0 8px #19c95b;line-height:1.05;padding:0 6px}
.msgbar .t small{display:block;font-size:.7em}
.msgbar.split{display:grid;grid-template-columns:1fr 1fr;padding:0}
.msgbar.split>div{height:100%;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,4.2vw,17px);color:#5dffae;text-shadow:0 0 6px #19c95b}
.msgbar.split>div.inv{background:#5dffae;color:#002b14;text-shadow:none}
.msgbar.money .t{animation:money .5s steps(2) infinite}
@keyframes money{50%{color:#fff;text-shadow:0 0 14px #5dffae}}

/* ---------- Reels ---------- */
.reelbox{position:relative;margin-top:10px;padding:8px 20px;border-radius:14px;background:var(--chrome);
  box-shadow:0 0 0 2px #3a3a46,0 10px 24px #000c,inset 0 0 0 2px #fff8}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:calc(var(--h)*3.4)}
.reel{position:relative;overflow:hidden;border-radius:5px;background:linear-gradient(180deg,#5d584f 0%,#cfc9bd 7%,#f6f3ec 22%,#fff 50%,#f6f3ec 78%,#cfc9bd 93%,#5d584f 100%);
  box-shadow:0 0 0 3px #2a2a33,0 0 0 5px #b9b9c8}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,#000a 0%,#0003 12%,#0000 26%,#0000 74%,#0003 88%,#000a 100%),linear-gradient(90deg,#0003,#0000 15%,#0000 85%,#0003)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:var(--h);display:flex;align-items:center;justify-content:center}
.cell svg{display:block;filter:drop-shadow(0 2px 2px #0006)}
.reel.blur .strip{filter:blur(1.5px)}
.lines{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.lines polyline{fill:none;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px #000)}
.box{position:absolute;pointer-events:none;z-index:5;border:4px solid var(--gold);border-radius:6px;box-shadow:0 0 12px var(--gold);animation:boxp .3s steps(2) infinite}
@keyframes boxp{50%{border-color:#fff}}
.winamt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:6;text-align:center;pointer-events:none;
  font-size:clamp(36px,13vw,58px);background:linear-gradient(180deg,#fffbe0,#ffd23f 45%,#c98a00 55%,#ffe27a);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #5a3a00;filter:drop-shadow(0 3px 0 #3d2600) drop-shadow(0 0 14px #ffb300);opacity:0;transition:opacity .15s}
.winamt.on{opacity:1}
.dealtag{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dealtag span{font-family:"Courier New",monospace;font-weight:900;font-size:calc(var(--h)*.3);color:var(--gold);background:#000d;border:2px solid var(--gold);
  border-radius:6px;padding:1px 6px;box-shadow:0 0 10px #ffd23f88}
.lmark{position:absolute;width:16px;height:16px;margin-top:-8px;border-radius:50%;z-index:3;display:flex;align-items:center;justify-content:center;
  font:400 11px AntonLocal,Anton,"Arial Black",sans-serif;color:#000;box-shadow:0 0 0 1px #0008,0 1px 2px #0008}
.lmark.hit{box-shadow:0 0 0 2px #fff,0 0 10px currentColor}

/* ---------- Meters & controls ---------- */
.meters{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-top:12px;text-align:center}
.meter .v{border-radius:6px;padding:4px 2px;font-family:"Courier New",monospace;font-weight:900;font-size:clamp(15px,4.8vw,20px);color:#fff;
  background:linear-gradient(#000,#1a1a1a);box-shadow:0 0 0 2px #2a2a33,0 0 0 4px #9a9aa8,inset 0 2px 6px #000}
.meter .v.led{color:#ff4636;text-shadow:0 0 8px #ff3b2f}
.meter .v.grn{color:#5dffae;text-shadow:0 0 8px #19c95b}
.meter .lb{font-size:10px;letter-spacing:2px;color:#e9c8ff;margin-top:5px}
.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;margin-top:8px;justify-items:center}
.round{width:56px;height:56px;border-radius:50%;border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;
  background:radial-gradient(circle at 40% 30%,#5a5a66,#1a1a20 70%);box-shadow:0 0 0 3px #d9d9e4,0 0 0 5px #4a4a56,0 4px 8px #000}
.spin{width:96px;height:96px;border-radius:50%;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(circle at 40% 28%,#d6b8ff 0%,#8a4dff 25%,#4a12b0 65%,#2a0870 100%);
  box-shadow:0 0 0 4px #f1f1f7,0 0 0 7px #6c6c7c,0 0 0 9px #c9c9d6,0 6px 12px #000,0 0 24px #8a4dff88,inset 0 -6px 12px #0006}
.spin .i{font-size:34px;line-height:1;text-shadow:0 2px 2px #0008}
.spin .lbl{font-size:11px;letter-spacing:2px;margin-top:1px}
.spin:active,.round:active{transform:translateY(2px)}
.spin:disabled,.round:disabled{filter:brightness(.5) grayscale(.6);cursor:default}
.autowrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.autocnt{font-family:"Courier New",monospace;font-weight:900;background:#000;border-radius:5px;padding:0 8px;font-size:15px;min-width:42px;text-align:center;box-shadow:0 0 0 2px #9a9aa8}
.bdeck{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.bbtn{font-family:inherit;border-radius:12px;padding:14px 4px;font-size:clamp(16px,5vw,21px);letter-spacing:1px;cursor:pointer;color:#fff;border:none;
  box-shadow:0 0 0 3px #f1f1f7,0 0 0 5px #6c6c7c,0 5px 0 5px #000,inset 0 2px 0 #fff6;text-shadow:0 2px 0 #0008}
.bbtn:active{transform:translateY(3px)}
.bbtn.take{background:linear-gradient(#ff5a66,#c4101e 55%,#7a0610)} .bbtn.try{background:linear-gradient(#5a8cff,#1a48d0 55%,#0b2577)}
.bbtn.go{grid-column:span 2;background:linear-gradient(#b48aff,#6a2be0 55%,#3a0c90);font-size:26px}
.bbtn.hint{animation:hint 1s infinite}
@keyframes hint{50%{box-shadow:0 0 0 3px #fff,0 0 0 5px #6c6c7c,0 5px 0 5px #000,0 0 22px 6px #fff}}
.hide{display:none!important}
.foot{text-align:center;font:600 11px system-ui,sans-serif;color:#a99bb8;margin-top:12px;line-height:1.5}

/* ---------- Bottom sheet ---------- */
.sheet{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheetin{width:min(460px,100vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border-top:3px solid var(--gold2);
  font-family:system-ui,sans-serif;font-weight:700;color:#eee}
.tabs{display:flex;background:var(--panel2)}
.tabs button{flex:0 0 64px;height:56px;background:none;border:none;color:#888;font-size:24px;cursor:pointer}
.tabs button.on{background:var(--panel);color:#fff}
.tabs .x{margin-left:auto;color:#fff;font-size:30px}
.sbody{overflow:auto;padding:14px 16px;flex:1}
.sbody h2{font:400 20px AntonLocal,Anton,"Arial Black",sans-serif;letter-spacing:1px;margin:2px 0 12px;color:#fff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips.five{grid-template-columns:repeat(5,1fr)}
.chips button{font:400 17px AntonLocal,Anton,"Arial Black",sans-serif;padding:12px 2px;border-radius:6px;border:none;background:#262033;color:#fff;cursor:pointer}
.chips button.on{background:#e6e6e6;color:#000}
.sline{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff14;font:400 17px AntonLocal,Anton,"Arial Black",sans-serif;letter-spacing:1px}
.tog{width:64px;height:34px;border-radius:17px;background:#444;position:relative;cursor:pointer;border:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#5cc93a}.tog.on::after{left:34px}
.sfoot{padding:12px 16px 16px;display:flex;gap:10px}
.sfoot button{flex:1;font:400 18px AntonLocal,Anton,"Arial Black",sans-serif;padding:14px;border:none;border-radius:6px;color:#fff;cursor:pointer;background:#0a84e8}
.sfoot button.gray{background:#2e2a3a}
.note{font-weight:500;font-size:13px;color:#b9a9c9;margin-top:10px}
.sbody table{width:100%;border-collapse:collapse;font-size:13px;font-weight:600}
.sbody td,.sbody th{padding:5px 4px;border-bottom:1px solid #ffffff14;text-align:right}
.sbody td:first-child,.sbody th:first-child{text-align:left}
.sbody th{color:#e9c8ff;font-size:12px}
.sbody h3{color:#7dff9f;font-size:14px;margin:16px 0 6px}
.sbody p{font-weight:500;font-size:14px;line-height:1.45;margin:6px 0}
.mini{display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;vertical-align:middle;--h:30px}

.flash{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle,#ffd23f55,transparent 60%);opacity:0;transition:opacity .2s}
.flash.on{opacity:1}
.coin{position:fixed;left:0;top:0;z-index:16;pointer-events:none;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff7c2,#ffd23f 45%,#a87000);box-shadow:0 0 6px #ffd23f,inset 0 0 0 2px #c98a00}

/* =================== ARTWORK SKIN =================== */
body{flex-direction:column;align-items:center}
.cab{padding:0;border-radius:0;background:none;box-shadow:none;margin:6px 0 0;
  border-style:solid;border-width:34px 32px 26px 34px;
  border-image:url(art/cabinet.webp) 115 110 85 115 fill / 34px 32px 26px 34px stretch}
.cab .bulbs{inset:0}
.bulb{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#0008;box-shadow:none}
.logo{position:relative;margin:2px 4px 0}
.logo img{display:block;width:100%;filter:drop-shadow(0 4px 4px #000c) drop-shadow(0 0 10px #19c95b55)}
.board{margin-top:6px}
.star{clip-path:none;background:none;width:clamp(56px,16vw,72px);aspect-ratio:auto}
.star img{display:block;width:100%;filter:drop-shadow(0 3px 3px #000a)}
.star.lit{filter:drop-shadow(0 0 12px #ffd23f) drop-shadow(0 0 4px #fff)!important}
.plaque{padding:0;border-radius:0;background:url(art/plaque.webp) center/100% 100% no-repeat;box-shadow:none;aspect-ratio:700/260;filter:drop-shadow(0 4px 4px #000a)}
.plaque .v{position:absolute;left:13%;top:40%;width:73.9%;height:42.3%;margin:0;display:flex;align-items:center;justify-content:center;
  background:none;box-shadow:none;font-size:clamp(17px,5.6vw,26px)}
.plaque.lit{box-shadow:none;filter:drop-shadow(0 0 14px #ffd23f)!important}
.reelbox{border-style:solid;border-width:16px 18px 16px 18px;border-image:url(art/reelframe.webp) 55 62 56 62 / 16px 18px 16px 18px stretch;
  border-radius:0;padding:6px 14px;background:var(--chrome);background-clip:padding-box;box-shadow:0 8px 18px #000c}
.lmark{width:13px;height:13px;margin-top:-6.5px;font-size:9px}
.cell img{display:block;max-width:90%;max-height:92%;filter:drop-shadow(0 3px 3px #0007)}
.mini img{max-width:100%;max-height:100%;display:block}
.spin{background:url(art/spin.webp) center/contain no-repeat;box-shadow:none;width:104px;height:104px}
.spin .i,.spin .lbl{text-shadow:0 2px 3px #000}
.spin:not(:disabled){filter:drop-shadow(0 0 10px #8a4dff99)}
.bbtn{aspect-ratio:600/198;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:none!important;border-radius:0}
.bbtn.take{background:url(art/btn_red.webp) center/100% 100% no-repeat}
.bbtn.try,.bbtn.go{background:url(art/btn_blue.webp) center/100% 100% no-repeat}
.bbtn.go{aspect-ratio:auto;height:64px;background-size:100% 100%}
.bbtn.hint{animation:hint2 1s infinite}
@keyframes hint2{50%{filter:brightness(1.25) drop-shadow(0 0 12px #fff)}}
.console{width:min(460px,100vw);padding:10px 14px 12px;margin:0 0 16px;border-radius:0 0 26px 26px;
  background:linear-gradient(180deg,#24242c,#0b0b10);box-shadow:0 0 0 3px #c9c9d6,0 0 0 5px #4a4a56,0 14px 30px #000}
.console .meters{margin-top:4px}
/* neon "DEAL" under the gold logo */
.logo{text-align:center}
.logo img{width:auto;max-width:100%;max-height:8.6vh;margin:0 auto}
.logo .neon{position:relative;margin-top:-1.6vh;font-family:AntonLocal,Anton,"Arial Black",sans-serif;font-size:clamp(24px,min(9vw,4.6vh),40px);
  line-height:1;letter-spacing:.35em;padding-left:.35em;color:#eafff0;
  text-shadow:0 0 2px #fff,0 0 6px #3cff8a,0 0 12px #19c95b,0 0 22px #19c95b,0 0 36px #19c95b;animation:neon 7s infinite}
@keyframes neon{0%,91%,95%,100%{opacity:1}92%,94%{opacity:.35}93%{opacity:.85}}
/* fit the whole machine on one phone screen */
.cab{margin-top:0}
:root{--chip:min(54px,14vw,6.1vh)}

<script>
"use strict";
/* =================================================================
   GAME MATH — the same numbers drive play and the odds screen
   ================================================================= */
const PAY = { X3:1000, S7:80, B3:40, B2:25, B1:12, ANYBAR:5, C1:1, C2:4, C3:15, W2:8 }; // × line bet
const NLINES = 5;
const LINES = [[1,1,1],[0,0,0],[2,2,2],[0,1,2],[2,1,0]];       // rows per reel: 0 top, 1 middle, 2 bottom
const LINECOL = ['#ff2b3a','#ffd23f','#3cff8a','#4da3ff','#ff6bf0'];
const R12 = ['X2','B1','S7','B2','CH','B1','B3','B1','S7','B2','CH'];
const R3  = ['X2','B1','S7','B2','CH','B1','B3','B1','OF','B2','CH'];
const WEIGHT = { X2:4, S7:6, B3:12, B2:18, B1:36, CH:20, BL:2, NX:1, OF:2 }; // virtual-reel weight per stop
// Deal Round: each offer lights 1–5 board values and adds them up (× total bet);
// then each 2X star may light, doubling it (both = ×4)
const CELLS = [1,1.5,2,3,4,5,6,8,10], CELLW = [30,26,20,14,9,6,4,2.5,1.5];
const TOPV = 100, TOPW = 0.15;
const PICKS = [[1,22],[2,30],[3,26],[4,14],[5,8]];               // [how many values light, weight]
const MULTS = [[1,80],[2,16],[4,4]];
const NOFFERS = [[3,30],[4,50],[5,20]];
const BOARD_ORDER = [3,8,2, 4,1.5,1, 6,10,5];                 // where each value sits on the 3×3 board
const CHIPCOL = {1:['#e8742a','#7a3300'],1.5:['#9b4dff','#4a1a8a'],2:['#d4a400','#6b5200'],3:['#18a957','#06502a'],4:['#2a74e0','#0c3478'],
                 5:['#e03a9a','#701046'],6:['#12b5a8','#055a53'],8:['#d62030','#6a0610'],10:['#262626','#000']};
const BETS = [10,20,30,50,100,150,200,300,500,1000,2000,3000];  // cents
const COINS = 10;

const NSTOP = 22;
const STRIPS = [R12,R12,R3].map(s => s.flatMap(x => [x,'BL']));
STRIPS[2].forEach((x,i) => { if (x==='OF'){ STRIPS[2][(i+1)%NSTOP]='NX'; STRIPS[2][(i-1+NSTOP)%NSTOP]='NX'; }});
const isBlank = s => s==='BL' || s==='NX' || s==='OF';

function evalLine(l){
  const w = l.filter(s=>s==='X2').length;
  if (w===3) return { x:PAY.X3, name:'TRIPLE 2X', top:true };
  const nw = l.filter(s=>s!=='X2'), m = 2**w;
  const names = {S7:'THREE 7s',B3:'TRIPLE BARS',B2:'DOUBLE BARS',B1:'SINGLE BARS',CH:'THREE CHERRIES'};
  if (nw.every(s=>s===nw[0]) && PAY[nw[0]]) return { x:PAY[nw[0]]*m, name:names[nw[0]], m };
  if (nw.every(s=>s[0]==='B' && s!=='BL')) return { x:PAY.ANYBAR*m, name:'ANY BARS', m };
  if (l[0]==='CH'){ let c=0; for (const s of l){ if (s==='CH'||s==='X2') c++; else break; }
    return { x:PAY['C'+c]*(c<3?m:1), name: c===1?'CHERRY':'TWO CHERRIES', m:c<3?m:1 }; }
  if (w===2) return { x:PAY.W2, name:'TWO 2X', m:1 };
  return { x:0 };
}
const windowAt = (r, stop) => [-1,0,1].map(d => STRIPS[r][(stop+d+NSTOP)%NSTOP]);
function evaluate(stops, bet){
  const win = stops.map((s,r) => windowAt(r,s));
  const lineBet = bet/NLINES, wins = [];
  LINES.forEach((L,i) => { const l = L.map((row,r)=>win[r][row]); const e = evalLine(l);
    if (e.x>0) wins.push({ line:i, amt:Math.round(e.x*lineBet), ...e }); });
  const dealRow = win[2].indexOf('OF');
  return { wins, total: wins.reduce((a,w)=>a+w.amt,0), dealRow };
}

// exact distribution of one offer (in multiples of total bet)
const BVALS = [...CELLS, TOPV], BW = [...CELLW, TOPW];
const OFFERDIST = (() => {
  const dist = new Map(), kt = PICKS.reduce((a,p)=>a+p[1],0), mt = MULTS.reduce((a,m)=>a+m[1],0), n = BVALS.length;
  function rec(used, sum, p, depth, k){
    if (depth===k){ for (const [m,mw] of MULTS){ const v=Math.round(sum*m*100)/100; dist.set(v,(dist.get(v)||0)+p*mw/mt); } return; }
    let rem=0; for (let i=0;i<n;i++) if (!(used&(1<<i))) rem+=BW[i];
    for (let i=0;i<n;i++) if (!(used&(1<<i))) rec(used|(1<<i), sum+BVALS[i], p*BW[i]/rem, depth+1, k);
  }
  PICKS.forEach(([k,kw]) => rec(0,0,kw/kt,0,k));
  return [...dist.entries()];
})();
const CONT = (() => { const v=[0]; v[1]=OFFERDIST.reduce((a,[x,p])=>a+x*p,0);
  for (let k=2;k<=5;k++) v[k]=OFFERDIST.reduce((a,[x,p])=>a+Math.max(x,v[k-1])*p,0); return v; })(); // CONT[k] = value of k offers still to come

function computeOdds(){
  const wt = STRIPS.map(s=>s.map(x=>WEIGHT[x])), T = wt.map(r=>r.reduce((a,b)=>a+b,0));
  let line=0, hit=0, bonus=0, top=0; const freq={};
  for (let a=0;a<NSTOP;a++) for (let b=0;b<NSTOP;b++) for (let c=0;c<NSTOP;c++){
    const p = wt[0][a]*wt[1][b]*wt[2][c]/(T[0]*T[1]*T[2]);
    const r = evaluate([a,b,c], NLINES);           // bet = 5 → line bet 1
    line += p*r.total/NLINES;
    if (r.total>0 || r.dealRow>=0) hit+=p;
    if (r.dealRow>=0) bonus+=p;
    if (r.wins.some(w=>w.top)) top+=p;
    r.wins.forEach(w => freq[w.name]=(freq[w.name]||0)+p);
  }
  const nw = NOFFERS.reduce((a,n)=>a+n[1],0);
  const best = NOFFERS.reduce((a,n)=>a+CONT[n[0]]*n[1],0)/nw;
  return { line, hit, bonus, top, freq, mean:CONT[1], best, rtpFirst: line+bonus*CONT[1], rtpBest: line+bonus*best };
}

/* ---------- RNG ---------- */
function rand(){ const u=new Uint32Array(1); crypto.getRandomValues(u); return u[0]/4294967296; }
function pickW(n, wfn){ let tot=0; for (let i=0;i<n;i++) tot+=wfn(i); let r=rand()*tot;
  for (let i=0;i<n;i++){ r-=wfn(i); if (r<0) return i; } return n-1; }
const pickStop = r => pickW(NSTOP, i => WEIGHT[STRIPS[r][i]]);
function pickOffer(){ // which values light up (1–5 of them, no repeats) and the multiplier
  const k = PICKS[pickW(PICKS.length, i => PICKS[i][1])][0];
  const left = BVALS.map((v,i)=>i), vals = [];
  for (let j=0;j<k;j++){ const t = pickW(left.length, i => BW[left[i]]); vals.push(BVALS[left[t]]); left.splice(t,1); }
  const mult = MULTS[pickW(MULTS.length, i => MULTS[i][1])][0];
  const sum = vals.reduce((a,b)=>a+b,0);
  return { vals, sum, mult, x: Math.round(sum*mult*100)/100 };
}

/* =================================================================
   SOUND — synthesized live with Web Audio; voice uses the device's speech
   ================================================================= */
const S = { ctx:null, sfxBus:null, musBus:null, all:true, music:true, sfx:true, voice:true };
function audio(){
  if (!S.ctx){ const AC = window.AudioContext||window.webkitAudioContext; if (!AC) return null;
    S.ctx = new AC(); const m = S.ctx.createGain(); m.gain.value=.6; m.connect(S.ctx.destination);
    S.sfxBus = S.ctx.createGain(); S.sfxBus.connect(m); S.musBus = S.ctx.createGain(); S.musBus.gain.value=.5; S.musBus.connect(m); }
  if (S.ctx.state==='suspended') S.ctx.resume();
  return S.ctx;
}
function tone(f, dur, {type='sine', vol=.3, at=0, slide=0, attack=.005, bus='sfx'}={}){
  if (!S.all || (bus==='sfx' ? !S.sfx : !S.music)) return;
  const c=audio(); if(!c) return;
  const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide), t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(bus==='sfx'?S.sfxBus:S.musBus); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,{vol=.2,at=0,freq=800}={}){
  if (!S.all || !S.sfx) return; const c=audio(); if(!c) return;
  const t=c.currentTime+at, n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=buf; f.type='lowpass'; f.frequency.value=freq; g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(S.sfxBus); s.start(t);
}
const SFX = {
  button(){ tone(880,.06,{type:'square',vol:.08}); },
  tick(){ tone(1600+Math.random()*200,.018,{type:'square',vol:.03}); },
  thunk(){ tone(150,.14,{vol:.45,slide:.4}); noise(.06,{vol:.25,freq:1200}); },
  wild(){ tone(1319,.18,{type:'triangle',vol:.2}); tone(1760,.3,{type:'triangle',vol:.2,at:.08}); },
  dealLand(){ [784,988,1175,1568].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.22,at:i*.07})); },
  tease(){ tone(220,1.4,{type:'sawtooth',vol:.06,slide:4,attack:.3}); },
  bell(i){ const f=[2093,2637,3136,2637][i%4]; tone(f,.12,{vol:.11}); tone(f*1.5,.08,{vol:.04}); },
  smallWin(){ [1047,1319,1568].forEach((f,i)=>tone(f,.16,{type:'square',vol:.07,at:i*.06})); },
  bigWin(){ [523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,{type:'square',vol:.08,at:i*.09})); },
  fanfare(){ [392,523,659,784].forEach((f,i)=>{tone(f,.22,{type:'sawtooth',vol:.08,at:i*.13}); tone(f/2,.22,{type:'square',vol:.05,at:i*.13});});
    [523,659,784,1047].forEach(f=>tone(f,.9,{type:'triangle',vol:.1,at:.6})); },
  shuffle(){ tone(700+Math.random()*700,.035,{type:'square',vol:.045}); },
  chipLand(k){ const f=[784,988,1175,1397,1568,1760][k%6]; tone(f,.16,{type:'triangle',vol:.16}); tone(f*2,.1,{vol:.05,at:.02}); noise(.05,{vol:.08,freq:4000}); },
  offerLand(){ tone(1568,.12,{type:'square',vol:.1}); tone(2093,.45,{type:'triangle',vol:.15,at:.08}); noise(.25,{vol:.07,freq:5000,at:.05}); },
  starTease(){ tone(1200,.04,{type:'square',vol:.05}); },
  multLit(){ [1319,1760,2349,3136].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.15,at:i*.05})); noise(.3,{vol:.06,freq:7000,at:.1}); },
  take(){ [784,1047,1319,1568,2093].forEach((f,i)=>tone(f,.25,{type:'triangle',vol:.14,at:i*.06})); },
  aww(){ tone(392,.35,{type:'sawtooth',vol:.06,slide:.7}); tone(311,.5,{type:'sawtooth',vol:.06,slide:.7,at:.3}); },
};

/* original background loop: swing-style bass + chords, faster in the Deal Round */
const MUS = { step:0, timer:null, fast:false };
const PROG = [[48,52,55,59],[45,48,52,55],[50,53,57,60],[43,47,50,53]]; // Cmaj7 Am7 Dm7 G7 (MIDI)
const mf = n => 440*Math.pow(2,(n-69)/12);
function musicTick(){
  if (!S.all || !S.music || !S.ctx) return;
  const st = MUS.step++, bar = Math.floor(st/8)%4, beat = st%8, ch = PROG[bar];
  if (beat%2===0) tone(mf(ch[[0,2,1,2][beat/2]]-12), .28, {type:'triangle',vol:.16,bus:'mus'});
  if (beat===2||beat===6) ch.slice(1).forEach(n=>tone(mf(n+12),.18,{type:'square',vol:.018,bus:'mus'}));
  if (MUS.fast && beat%2===1) tone(mf(ch[(st>>1)%4]+24),.09,{type:'triangle',vol:.05,bus:'mus'});
  if (beat===0||beat===4) noise(.03,{vol:.04,freq:6000});
}
function musicStart(fast){ MUS.fast=!!fast; clearInterval(MUS.timer); MUS.timer=setInterval(musicTick, fast?150:210); }

let voicePick=null;
function chooseVoice(){ if (!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); if(!vs.length) return;
  voicePick = vs.find(v=>/david|guy|daniel|alex|fred|male|google us english/i.test(v.name)) || vs[0]; }
if ('speechSynthesis' in window){ chooseVoice(); speechSynthesis.onvoiceschanged=chooseVoice; }
function say(text,{rate=1.05,pitch=.85}={}){
  if (!S.all || !S.voice) return;
  if (window.AndroidVoice){ AndroidVoice.speak(text); return; }   // Android app: phone's text-to-speech
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
  if (voicePick) u.voice=voicePick; u.rate=rate; u.pitch=pitch; speechSynthesis.speak(u);
}
function stopVoice(){ if (window.AndroidVoice) AndroidVoice.stop(); else if ('speechSynthesis' in window) speechSynthesis.cancel(); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const money = c => '$' + (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const spoken = c => { const d=Math.floor(c/100), k=c%100; return (d? d+' dollar'+(d===1?'':'s'):'') + (d&&k?' and ':'') + (k? k+' cents':'') || 'zero'; };

/* =================================================================
   LIGHTS — bulbs chase around the whole cabinet
   ================================================================= */
const bulbs=[];
// light-bulb spots on the painted cabinet (percent of the image), mapped through the stretched frame
const BULBS = [[2.28, 45.89], [2.34, 41.52], [2.41, 37.2], [2.43, 32.84], [2.45, 28.52], [2.57, 24.21], [2.6, 20.61], [2.65, 16.72], [2.65, 12.89], [2.63, 8.67], [11.18, 0.77], [19.26, 4.77], [21.16, 4.07], [21.1, 1.93], [21.38, 1.16], [30.12, 1.29], [38.34, 5.28], [38.94, 1.3], [42.03, 2.71], [45.64, 0.9], [60.89, 1.17], [63.85, 4.16], [69.71, 1.28], [71.19, 4.15], [78.46, 1.31], [78.51, 4.17], [97.26, 8.67], [97.32, 12.9], [97.34, 16.75], [97.36, 20.64], [97.42, 24.19], [97.47, 28.54], [97.46, 32.84], [97.46, 37.19], [97.61, 41.53], [97.66, 45.9], [97.75, 54.37], [97.76, 58.79], [97.9, 63.17], [97.91, 67.66], [93.63, 69.04], [97.99, 71.78], [93.61, 73.61], [98.05, 76.15], [93.62, 78.2], [93.61, 82.81], [93.66, 87.45], [93.69, 92.19], [93.72, 96.82], [84.02, 96.49], [75.42, 96.52], [66.96, 96.5], [58.44, 96.49], [49.96, 96.51], [41.43, 96.49], [32.92, 96.5], [24.43, 96.5], [15.86, 96.5], [6.16, 96.81], [6.14, 92.15], [6.23, 87.44], [6.22, 82.81], [6.29, 78.25], [1.81, 76.17], [6.29, 73.63], [2.0, 71.79], [6.37, 69.03], [6.98, 68.06], [1.91, 67.66], [2.0, 63.18], [2.12, 58.8], [2.08, 54.38]];
const CAB_IMG=[676,1258], CAB_SLICE=[115,110,85,115];   // top, right, bottom, left (image pixels)
function buildBulbs(){
  const cab=$('cab'), host=$('bulbs'), cs=getComputedStyle(cab);
  const T=parseFloat(cs.borderTopWidth), R=parseFloat(cs.borderRightWidth), B=parseFloat(cs.borderBottomWidth), L=parseFloat(cs.borderLeftWidth);
  const W=cab.offsetWidth, H=cab.offsetHeight, [iw,ih]=CAB_IMG, [st,sr,sb,sl]=CAB_SLICE;
  const map=(v,n,a,b,A,Bn,N)=> v<a ? v*A/a : v>n-b ? N-(n-v)*Bn/b : A+(v-a)*(N-A-Bn)/(n-a-b);
  host.innerHTML=''; bulbs.length=0;
  BULBS.forEach(([px,py])=>{ const x=map(px/100*iw,iw,sl,sr,L,R,W)-L, y=map(py/100*ih,ih,st,sb,T,B,H)-T;
    const e=document.createElement('div'); e.className='bulb'; e.style.left=x+'px'; e.style.top=y+'px'; host.appendChild(e); bulbs.push(e); });

const reels = STRIPS.map((s,r)=>({ r, strip:s, pos:Math.floor(rand()*NSTOP), el:null, stripEl:null }));
let H=68; const OFF = () => H*.2;   // the window shows a sliver of the symbols above and below
function buildReels(){
  const host=$('reels');
  reels.forEach(R=>{ const el=document.createElement('div'); el.className='reel'; const st=document.createElement('div'); st.className='strip';
    let h=''; for (let k=0;k<3;k++) for (const s of R.strip) h+=`<div class="cell">${SYM[s]}</div>`;
    st.innerHTML=h; el.appendChild(st); host.insertBefore(el,$('lines')); R.el=el; R.stripEl=st; });

}
function sizeReels(){
  const w=$('reels').getBoundingClientRect().width;
  H=Math.max(44,Math.min(84,Math.floor((w-16)/3*.6),Math.floor(innerHeight*.064))); document.documentElement.style.setProperty('--h',H+'px'); reels.forEach(drawReel);
  // line-number markers: left side at the line's first row, right side at its last row (nudged apart when they share a row)
  const used={};
  LINES.forEach((L,i)=>['l','r'].forEach(side=>{ const row=side==='l'?L[0]:L[2], key=side+row; const n=used[key]=(used[key]||0)+1;
    const el=$(`lm${side}${i}`); el.style.top=(8+OFF()+(row+.5)*H+(n-1)*18-(row===1?0:9))+'px'; }));
}
function drawReel(R){ const p=((R.pos%NSTOP)+NSTOP)%NSTOP+NSTOP; R.stripEl.style.transform=`translateY(${-(p-1)*H+OFF()}px)`; }

const SPEED=26; let quickStop=false;
function spinReels(targets, tease){
  return new Promise(resolve=>{
    const t0=performance.now(), stopAt=[650,950,tease?2500:1250];
    const st=reels.map((R,i)=>({phase:'spin',target:targets[i]}));
    reels.forEach(R=>R.el.classList.add('blur')); let last=t0, lastTick=0, teased=false; quickStop=false;
    function frame(now){
      const dt=(now-last)/1000; last=now;
      reels.forEach((R,i)=>{ const s=st[i];
        if (s.phase==='spin'){ R.pos-=SPEED*dt;
          if (now-t0>=stopAt[i] || (quickStop && now-t0>150)){ const cur=((R.pos%NSTOP)+NSTOP)%NSTOP; let d=((cur-s.target)%NSTOP+NSTOP)%NSTOP; if(d<4) d+=NSTOP;
            s.phase='stop'; s.start=R.pos; s.dist=d; s.t=now; } }
        else if (s.phase==='stop'){ const t=(now-s.t)/1000*(quickStop?2:1), t1=(s.dist-3)/SPEED, t2=6/SPEED; let trav, done=false;
          if (t<t1) trav=SPEED*t; else { const v=Math.min(1,(t-t1)/t2); trav=(s.dist-3)+3*(1-(1-v)*(1-v)); done=v>=1; }
          R.pos=s.start-trav;
          if (done){ R.pos=s.start-s.dist; s.phase='bounce'; s.tb=now; R.el.classList.remove('blur'); SFX.thunk();
            const w=windowAt(i,s.target); if (w.includes('X2')) SFX.wild(); if (w.includes('OF')) SFX.dealLand();
            if (i===1 && tease && !teased && !quickStop){ teased=true; SFX.tease(); lightMode='tease'; msg('2X … 2X … ?'); } } }
        else if (s.phase==='bounce'){ const u=Math.min(1,(now-s.tb)/160), base=Math.round(s.start-s.dist);
          R.pos=base-Math.sin(u*Math.PI)*.12; if (u>=1){ R.pos=base; s.phase='done'; } }
        drawReel(R); });
      if (now-lastTick>55 && st.some(s=>s.phase==='spin')){ lastTick=now; SFX.tick(); }
      if (st.every(s=>s.phase==='done')){ reels.forEach(R=>R.pos=((Math.round(R.pos)%NSTOP)+NSTOP)%NSTOP); resolve(); }
      else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

}

}

async function rollup(amount, big){
  let shown=0, i=0, skip=false; rolling=()=>{skip=true}; render();
  const base=G.bal, steps=big?80:30, step=Math.max(1,Math.ceil(amount/steps));
  while (shown<amount && !skip){ shown=Math.min(amount,shown+step); G.bal=base+shown;
    $('mWin').textContent=money(shown); $('mBal').textContent=money(G.bal); SFX.bell(i++); await sleep(big?40:55); }
  G.bal=base+amount; $('mWin').textContent=money(amount); $('mBal').textContent=money(G.bal); rolling=null;
}

async function spin(){
  if (spinningNow){ quickStop=true; return; }
  if (rolling){ rolling(); return; }
  if (busy) return;
  if (G.bal<G.bet){ autoLeft=0; G.bal+=10000; save(); render(); msg('+$100.00 PLAY MONEY'); SFX.take(); return; }
  audio(); if (!MUS.timer) musicStart(false);

  G.bal-=G.bet; G.spins++; G.wagered+=G.bet; save();

  const w0=windowAt(0,stops[0]), w1=windowAt(1,stops[1]);
  const tease=LINES.some(L=>w0[L[0]]==='X2'&&w1[L[1]]==='X2');
  await spinReels(stops, tease); spinningNow=false;
  const res=evaluate(stops, G.bet);
  if (res.total>0){
    G.won+=res.total; G.best=Math.max(G.best,res.total);
    const big=res.total>=20*G.bet, top=res.wins.some(w=>w.top);
    lightMode=big?'big':'win'; $('winamt').textContent=money(res.total); $('winamt').classList.add('on');
    res.wins.forEach(w=>drawLine(w.line,true,true));
    msg(res.wins.length===1 ? `${res.wins[0].name}${res.wins[0].m>1?' ×'+res.wins[0].m:''} — ${money(res.total)}` : `${res.wins.length} LINES WIN ${money(res.total)}`, {money:big});
    if (top){ flash(1200); SFX.bigWin(); say('Jackpot! Triple double!'); coins(40); }

    else { SFX.smallWin(); if (res.wins.some(w=>w.m===4)) say('Four times!',{rate:1.15}); else if (res.wins.some(w=>w.m===2&&w.x>=30)) say('Doubled!',{rate:1.15}); }
    await rollup(res.total, big);
    $('winamt').classList.remove('on');
    document.querySelectorAll('.box').forEach(e=>e.remove());
  }
  save();
  if (res.dealRow>=0){ showWinsToken++; await sleep(500); await dealRound(res.dealRow); }
  else if (res.total>0){ cycleWins(res.wins); }
  else msg(G.bal<G.bet?'OUT OF MONEY — TAP + FOR MORE':'GOOD LUCK');
  lightMode='idle'; busy=false; render();
  if (res.total===0 && res.dealRow<0) setTimeout(()=>{ if(!busy) msgCycle(IDLE_MSGS); }, 1500);
  if (autoLeft>0){ autoLeft--; render(); if (autoLeft>0 && G.bal>=G.bet){ await sleep(res.total>0?900:350); if (autoLeft>0 && !busy) spin(); } else { autoLeft=0; render(); } }
}

/* ---------- Deal Round ---------- */
function showDeck(which){ ['deckMain','deckGo','deckDeal'].forEach(id=>$(id).classList.toggle('hide',id!==which)); }
function waitGo(){ showDeck('deckGo'); return new Promise(r=>{ dealChoice=()=>{ dealChoice=null; SFX.button(); r(); }; }); }
function waitChoice(advice){ showDeck('deckDeal'); $('bTake').classList.toggle('hint',advice==='TAKE OFFER'); $('bTry').classList.toggle('hint',advice==='TRY AGAIN');
  return new Promise(r=>{ dealChoice=c=>{ dealChoice=null; r(c); }; }); }
function boardReset(){ document.querySelectorAll('.chip,.plaque,.star').forEach(t=>t.classList.remove('lit','won','flick')); }

async function revealOffer(o, bet){
  boardReset();
  // 1) the lights race around the board
  for (let f=0; f<18; f++){
    boardReset(); const n=1+Math.floor(rand()*4);
    for (let j=0;j<n;j++) tileFor(BVALS[Math.floor(rand()*BVALS.length)]).classList.add('lit');
    SFX.shuffle(); await sleep(70+f*3);
  }
  boardReset(); await sleep(250);
  // 2) the chosen values light one at a time and add up
  let sum=0;
  for (let j=0;j<o.vals.length;j++){
    const v=o.vals[j]; sum+=v; tileFor(v).classList.add('lit'); SFX.chipLand(j);
    msg(o.vals.slice(0,j+1).map(x=>money(Math.round(x*bet))).join(' + ') + (j>0?`<small>= ${money(Math.round(sum*bet))}</small>`:''));
    await sleep(560);
  }
  let total = Math.round(sum*bet);
  if (o.vals.length>1){ msg(`${o.vals.length} VALUES = ${money(total)}`); await sleep(500); }
  // 3) the 2X stars: each one that lights doubles the offer
  const stars=[$('mL'),$('mR')], lights = o.mult===4?2:o.mult===2?1:0;
  for (let s=0; s<2; s++){
    const willLight = s<lights;
    if (!willLight && (s>lights || rand()<.5)) break;              // sometimes a quick tease, sometimes nothing
    stars[s].classList.add('flick'); for (let k=0;k<(willLight?10:6);k++){ SFX.starTease(); await sleep(70); }
    stars[s].classList.remove('flick');
    if (!willLight){ await sleep(200); break; }
    stars[s].classList.add('lit'); total*=2; SFX.multLit(); flash(300);
    msg(`${s===0?'2X':'2X AGAIN'}! ${money(total)}`,{money:true}); await sleep(800);
  }
  SFX.offerLand();
  return total;
}
async function dealRound(row){
  G.deals++; const bet=G.bet;
  const n=NOFFERS[pickW(NOFFERS.length,k=>NOFFERS[k][1])][0];
  const offers=Array.from({length:n},()=>{ const o=pickOffer(); o.amt=Math.round(o.sum*bet)*o.mult; return o; });
  lightMode='deal'; flash(800); SFX.fanfare(); say("It's deal time!"); musicStart(true);
  msg('DEAL ROUND!',{money:true}); await sleep(1400);
  $('board').classList.add('bonus'); boardReset();
  msg('PRESS BUTTON<br>TO START BONUS'); await waitGo();
  msg(`YOU ARE AWARDED<br>${n} OFFERS!`); say(`You have ${n} offers!`); await waitGo();
  const ord=['FIRST','SECOND','THIRD','FOURTH','FIFTH'];
  let took=-1;
  for (let i=0;i<n;i++){
    showDeck('none'); msg(i===n-1?'FINAL OFFER':ord[i]+' OFFER'); await sleep(700);
    const o=offers[i]; await revealOffer(o, bet);
    msg(`${ord[i]} OFFER<br>${money(o.amt)}`,{money:o.mult>1});
    if (i===n-1){ say(`Final offer: ${spoken(o.amt)}. It's yours!`); took=i; await sleep(1500); break; }
    say(`${ord[i].toLowerCase()} offer: ${spoken(o.amt)}. Take it, or try again?`);
    await sleep(1100);
    const advice = o.x >= CONT[n-1-i] ? 'TAKE OFFER' : 'TRY AGAIN';
    msgHint(advice);
    const ch=await waitChoice(advice);
    if (ch==='take'){ took=i; break; }
    SFX.button(); say(['Feeling lucky!','Here we go again!','Let\'s see the next one!','Last chance!'][Math.min(i,3)],{rate:1.15});
  }
  showDeck('none');
  const win=offers[took].amt;
  boardReset(); offers[took].vals.forEach(v=>tileFor(v).classList.add('lit','won'));
  if (offers[took].mult>=2) $('mL').classList.add('lit'); if (offers[took].mult===4) $('mR').classList.add('lit');
  SFX.take(); flash(900); coins(16); lightMode='big';
  msg(`CONGRATULATIONS<br>YOU WIN ${money(win)}`,{money:true}); say(`Congratulations! You win ${spoken(win)}!`);
  G.won+=win; G.dealWon+=win; G.best=Math.max(G.best,win);
  await rollup(win,true); save(); await sleep(1500);
  const later=offers.slice(took+1);
  if (later.length){ const b=Math.max(...later.map(o=>o.amt));
    msg(`${b>win?'NEXT OFFERS WERE':'SMART DEAL!'}<br>${later.map(o=>money(o.amt)).join(' • ')}`);
    if (b>win) SFX.aww(); await sleep(2400); }
  $('board').classList.remove('bonus'); boardReset(); musicStart(false);
  const tag=document.createElement('div'); tag.className='dealtag'; tag.innerHTML=`<span>${money(win)}</span>`;
  const b=reels[2].el.getBoundingClientRect(), hb=$('reels').getBoundingClientRect();
  Object.assign(tag.style,{left:(b.left-hb.left)+'px',width:b.width+'px',top:(OFF()+row*H)+'px',height:H+'px'}); $('reels').appendChild(tag);
  msg(`TOTAL BONUS WIN<br>${money(win)}`); showDeck('deckMain');
}

    body.innerHTML=`<h2>AUTO SPIN SETTINGS</h2><p class="note" style="margin:0 0 10px">NUMBER OF AUTO SPINS</p>
      <div class="chips five">${[10,20,30,40,50].map(n=>`<button data-auto="${n}" class="${n===pendAuto?'on':''}">${n}</button>`).join('')}</div>
      <p class="note">Auto spin stops when you tap ■, when money runs low, and pauses for your Deal Round choices.</p>`;
    foot.innerHTML=`<button class="gray" id="fReset">RESET SETTINGS</button><button id="fStart">START</button>`;
    $('fReset').onclick=()=>{ pendAuto=0; drawSheet(); };
    $('fStart').onclick=()=>{ if(!pendAuto) return; autoLeft=pendAuto; closeSheet(); render(); spin(); };
  } else if (tab==='sound'){
    body.innerHTML=`<h2>SETTINGS</h2>
      <div class="sline">ALL SOUND ${tog('all')}</div><div class="sline">MUSIC ${tog('music')}</div>
      <div class="sline">SOUND EFFECTS ${tog('sfx')}</div><div class="sline">VOICE ${tog('voice')}</div>
      <p class="note">The voice uses your device's built-in speech, so it sounds different on different phones.</p>`;
    foot.innerHTML=`<button id="fOk">OK</button>`; $('fOk').onclick=closeSheet;
  } else {
    const mini=s=>`<span class="mini">${SYM[s]}</span>`, lb=money(G.bet/NLINES);
    const rows=[[['X2','X2','X2'],'TRIPLE 2X',PAY.X3],[['S7','S7','S7'],'THREE 7s',PAY.S7],[['B3','B3','B3'],'TRIPLE BARS',PAY.B3],
      [['B2','B2','B2'],'DOUBLE BARS',PAY.B2],[['B1','B1','B1'],'SINGLE BARS',PAY.B1],[['B1','B2','B3'],'ANY BARS',PAY.ANYBAR],
      [['CH','CH','CH'],'THREE CHERRIES',PAY.C3],[['CH','CH'],'TWO CHERRIES',PAY.C2],[['CH'],'CHERRY',PAY.C1],[['X2','X2'],'TWO 2X',PAY.W2]];
    const ret=G.wagered?pct(G.won/G.wagered):'—';
    body.innerHTML=`<h2>PAYTABLE & ODDS</h2>
      <p><b>An original game. Play money only — no real money, no prizes.</b></p>
      <p>${NLINES} lines are always played. Your total bet ${money(G.bet)} is split ${lb} per line. Line pays below are at your current bet.</p>
      <p><b>2X</b> is wild: one 2X doubles a line win, two multiply it by 4. Cherries pay from the left reel.</p>
      <p><b>DEAL</b> anywhere on reel 3 starts the <b>Deal Round</b> with 3, 4 or 5 offers. For each offer, 1 to 5 values on the board light up and are added together. Then each 2X star that lights doubles the offer (both stars = ×4). Take it or try again; the last offer is final. "Best play" shows the choice that pays the most on average.</p>
      <table><tr><th>Line</th><th>Pays</th><th>How often*</th></tr>${rows.map(r=>`<tr><td>${r[0].map(mini).join('')}<br><span style="font-size:11px">${r[1]}</span></td><td>${money(r[2]*G.bet/NLINES)}</td><td>${ODDS.freq[r[1]]?oneIn(ODDS.freq[r[1]]):''}</td></tr>`).join('')}</table>
      <p class="note">*Spins with that win on at least one line (any multiplier).</p>
      <h3>THE ODDS (exact, from the reel weights)</h3>
      <table><tr><td>Spins that pay something</td><td>${pct(ODDS.hit)}</td></tr>
        <tr><td>Deal Round</td><td>${oneIn(ODDS.bonus)} spins</td></tr>
        <tr><td>Triple 2X</td><td>${oneIn(ODDS.top)} spins</td></tr>
        <tr><td>Average offer</td><td>${ODDS.mean.toFixed(1)} × bet</td></tr>
        <tr><td>Values lit per offer</td><td>1: ${PICKS.map(p=>Math.round(p[1]/PICKS.reduce((a,q)=>a+q[1],0)*100)+'%').join(' • ')} :5</td></tr>
        <tr><td>Chance of 2X / both 2X</td><td>${MULTS[1][1]}% / ${MULTS[2][1]}%</td></tr>
        <tr><td>Payback if you always take the 1st offer</td><td>${pct(ODDS.rtpFirst)}</td></tr>
        <tr><td>Payback following "best play"</td><td>${pct(ODDS.rtpBest)}</td></tr></table>
      <p class="note">Payback is the long-run share of money bet that comes back as wins. Many spins "pay" less than the bet, like real multi-line games.</p>
      <h3>THIS SESSION</h3>
      <table><tr><td>Spins</td><td>${G.spins.toLocaleString()}</td></tr><tr><td>Bet</td><td>${money(G.wagered)}</td></tr><tr><td>Won</td><td>${money(G.won)}</td></tr>
        <tr><td>Your payback so far</td><td>${ret}</td></tr><tr><td>Deal Rounds</td><td>${G.deals} (${money(G.dealWon)})</td></tr><tr><td>Biggest win</td><td>${money(G.best)}</td></tr></table>`;
    foot.innerHTML=`<button class="gray" id="fAdd">+ $100 PLAY MONEY</button><button id="fOk">OK</button>`;
    $('fOk').onclick=closeSheet; $('fAdd').onclick=()=>{ G.bal+=10000; save(); render(); drawSheet(); SFX.take(); };
  }
}
$('sheet').addEventListener('click',e=>{
  const t=e.target.closest('button'); if (e.target===$('sheet')) return closeSheet(); if(!t) return;
  if (t.dataset.tab){ tab=t.dataset.tab; drawSheet(); }
  else if (t.dataset.bet){ pendBet=+t.dataset.bet; drawSheet(); SFX.button(); }
  else if (t.dataset.auto){ pendAuto=+t.dataset.auto; drawSheet(); SFX.button(); }
  else if (t.dataset.tog){ const k=t.dataset.tog; S[k]=!S[k]; if((k==='all'||k==='voice')&&!S[k]) stopVoice();
    save(); drawSheet(); audio(); SFX.button(); if (k==='voice'&&S.voice) say('Voice on!'); }
});
$('sClose').onclick=closeSheet;

/* ---------- Wiring ---------- */
$('bSpin').onclick=spin;
$('bGear').onclick=()=>openSheet('bet');
$('bAuto').onclick=()=>{ if (autoLeft>0){ autoLeft=0; render(); SFX.button(); } else openSheet('auto'); };
$('bGo').onclick=()=>dealChoice&&dealChoice();
$('bTake').onclick=()=>dealChoice&&dealChoice('take');
$('bTry').onclick=()=>dealChoice&&dealChoice('try');
document.addEventListener('keydown',e=>{
  if (!$('sheet').classList.contains('hide')){ if(e.key==='Escape') closeSheet(); return; }
  if (e.code==='Space'){ e.preventDefault(); if (dealChoice) dealChoice(!$('deckDeal').classList.contains('hide')?'try':undefined); else spin(); }
  else if (e.key==='Enter' && dealChoice){ e.preventDefault(); dealChoice($('deckDeal').classList.contains('hide')?undefined:'take'); }
});

buildReels(); sizeReels(); buildBulbs(); renderBoard(); render(); msgCycle(IDLE_MSGS);
addEventListener('resize',()=>{ sizeReels(); buildBulbs(); clearWins(); });
// the cabinet grows as the artwork loads, so keep the bulbs pinned to the painted ones
if ('ResizeObserver' in window) new ResizeObserver(()=>buildBulbs()).observe($('cab'));
addEventListener('load',()=>{ sizeReels(); buildBulbs(); });
// Android app hooks: Back closes the settings panel; leaving the app quiets the sound
window.onAndroidBack = () => { if (!$('sheet').classList.contains('hide')){ closeSheet(); return true; } return false; };
window.onAndroidPause = () => { autoLeft=0; render(); if (S.ctx) S.ctx.suspend(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.ctx) S.ctx.resume(); });
</script>
</body>
</html>
